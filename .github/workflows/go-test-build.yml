name: Go build and test

on:
  push:
    branches: ["main"]
    paths:
      - "**.go"
      - "go.*"
      - "Makefile"

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Test
        run: make test

      - name: Build
        run: make build
